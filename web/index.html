<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Assistente Financeiro Inteligente</title>
    <link rel="stylesheet" href="/css/dashboard.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #0f172a;
            font-family: system-ui, -apple-system, sans-serif;
            color: #f8fafc;
        }
        .auth-card {
            background: #1e293b;
            padding: 2.2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }
        .auth-tabs button {
            flex: 1;
            padding: 0.7rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            background: #334155;
            color: #cbd5e1;
        }
        .auth-tabs button.active {
            background: #10b981;
            color: #ffffff;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
            color: #cbd5e1;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #ffffff;
            box-sizing: border-box;
        }
        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 8px;
            background: #10b981;
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .btn-submit:hover {
            background: #059669;
        }
        .alert-box {
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
        }
        .alert-success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            color: #6ee7b7;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2 style="text-align: center; margin-top: 0;">Assistente Financeiro IA</h2>
        <div class="auth-tabs">
            <button id="tab-login" class="active" type="button" onclick="alternarAba('login')">Entrar</button>
            <button id="tab-register" type="button" onclick="alternarAba('register')">Criar Conta</button>
        </div>

        <div id="auth-alert" class="alert-box"></div>

        <!-- Formulário de Login -->
        <form id="form-login">
            <div class="form-group">
                <label for="login-email">E-mail</label>
                <input type="email" id="login-email" required placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label for="login-senha">Senha</label>
                <input type="password" id="login-senha" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit">Acessar Painel</button>
        </form>

        <!-- Formulário de Cadastro -->
        <form id="form-register" style="display: none;">
            <div class="form-group">
                <label for="reg-nome">Nome Completo</label>
                <input type="text" id="reg-nome" required placeholder="Seu Nome">
            </div>
            <div class="form-group">
                <label for="reg-email">E-mail</label>
                <input type="email" id="reg-email" required placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label for="reg-whatsapp">WhatsApp (com DDD, opcional)</label>
                <input type="text" id="reg-whatsapp" placeholder="5545999999999">
            </div>
            <div class="form-group">
                <label for="reg-senha">Senha (mínimo 6 caracteres)</label>
                <input type="password" id="reg-senha" required minlength="6" placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit">Cadastrar com Segurança</button>
        </form>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
